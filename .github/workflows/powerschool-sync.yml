# Daily PowerSchool auto-sync trigger. Calls the same /api/powerschool/cron
# endpoint Vercel Cron would, so scheduled sync works even if the Vercel
# project's own Cron Jobs list is empty. Needs two repo secrets
# (Settings -> Secrets and variables -> Actions):
#   APP_URL      e.g. https://canopy.apexengineeringak.com
#   CRON_SECRET  the same value as the CRON_SECRET env var on Vercel
name: PowerSchool scheduled sync
on:
  # Manual-only now that Vercel's own cron entry registers (a second daily
  # trigger would just double-sync). To use this as the scheduler instead,
  # add back:  schedule: [{ cron: '0 12 * * *' }]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger sync
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 330 \
            -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL%/}/api/powerschool/cron")
          cat response.json; echo
          if [ "$code" != "200" ]; then echo "Cron endpoint returned HTTP $code"; exit 1; fi
