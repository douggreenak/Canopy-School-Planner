name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- src/app/api src/lib/db.ts src/lib/db.test.ts src/lib/powerschoolSync.ts src/lib/powerschoolSync.test.ts scripts/run-sync.ts scripts/sync-local.ts

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
